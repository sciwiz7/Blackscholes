[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "blackscholeslab"
version = "0.1.0.dev0"
description = "A transparent and carefully tested Python toolkit for Black-Scholes option analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amrut Deshmukh" }]
keywords = [
    "black-scholes",
    "options",
    "finance",
    "greeks",
    "quantitative-finance",
    "derivatives",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
blackscholeslab = "blackscholeslab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/sciwiz7/Blackscholes"
Repository = "https://github.com/sciwiz7/Blackscholes"
Issues = "https://github.com/sciwiz7/Blackscholes/issues"
Changelog = "https://github.com/sciwiz7/Blackscholes/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/blackscholeslab"]

[tool.hatch.build.targets.sdist]
include = [
    "src/blackscholeslab",
    "tests",
    "docs",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "GOVERNANCE.md",
    "ROADMAP.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=blackscholeslab --cov-report=term-missing --cov-report=xml"
