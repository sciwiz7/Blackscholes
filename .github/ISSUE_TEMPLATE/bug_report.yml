name: Bug report
description: Report a defect in BlackScholesLab
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please provide as much
        detail as possible so the issue can be reproduced.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code that reproduce the behaviour.
      placeholder: |
        1. ...
        2. ...
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Mathematical references
      description: If the bug concerns a calculation, cite the reference value or source.
    validations:
      required: false
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Checklist
      options:
        - label: I have not included any secrets, credentials, or confidential data.
          required: true
