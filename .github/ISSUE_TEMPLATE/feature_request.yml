name: Feature request
description: Suggest a new capability for BlackScholesLab
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or need motivates this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: Mathematical references
      description: For analytical features, include textbooks, papers, or formulas.
    validations:
      required: false
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Checklist
      options:
        - label: I have not included any secrets, credentials, or confidential data.
          required: true
